name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  server-unit-tests:
    name: Server unit tests (Jest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      # mongodb-memory-server downloads its own mongod binary and spins up a
      # real single-node replica set per run — Mongoose transactions (used
      # throughout salesController) require a replica set, not a standalone
      # mongod, so this is not swappable for a plain "mongodb" service
      # container without losing transaction coverage.
      - run: npm test

  client-lint:
    name: Client lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
      - run: npm run lint

  smoke-test:
    name: Live API smoke test
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.runCommand({ping:1})'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      MONGO_URI: mongodb://127.0.0.1:27017/wanguvibe_ci
      PORT: 5000
      CLIENT_URL: http://localhost:5173
      JWT_SECRET: ci-smoke-test-secret
      MPESA_MODE: mock
      ETIMS_MODE: mock
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: server/package-lock.json
      - name: Install server deps
        working-directory: server
        run: npm ci
      - name: Seed the first admin user
        working-directory: server
        run: node scripts/seedAdmin.js admin "WanguNiW@ngu" "CI Admin"
      - name: Start server in the background
        working-directory: server
        run: nohup node server.js > server.log 2>&1 &
      - name: Wait for the server to accept connections
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:5000/ > /dev/null; then
              echo "Server is up"; exit 0
            fi
            sleep 1
          done
          echo "Server never came up"; exit 1
      - name: Run the smoke test suite
        working-directory: server
        run: node scripts/smokeTest.js http://localhost:5000 "WanguNiW@ngu"
      - name: Dump server log on failure
        if: failure()
        working-directory: server
        run: cat server.log || true
