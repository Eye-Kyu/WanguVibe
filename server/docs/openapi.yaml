openapi: 3.1.0
info:
  title: Wanguvibe POS — Public Integration API
  version: "1.0.0"
  description: >
    Read-only API for third-party integrations (accounting software, an
    online storefront) plus outbound webhook event documentation.
    All /v1 endpoints require an API key generated by an admin in the POS
    (Admin → API Keys), sent as the X-API-Key header. This is a separate
    credential from staff login — it authenticates a system, not a user.
servers:
  - url: /api/v1
security:
  - ApiKeyAuth: []
components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
  schemas:
    Sale:
      type: object
      properties:
        id: { type: string }
        totalAmount: { type: number }
        paymentMethod: { type: string, enum: [cash, mpesa, card, store_credit, gift_card, split] }
        status: { type: string, enum: [completed, partially_returned, returned] }
        refundedAmount: { type: number }
        itemCount: { type: integer }
        createdAt: { type: string, format: date-time }
    Style:
      type: object
      properties:
        _id: { type: string }
        name: { type: string }
        styleCode: { type: string }
        brand: { type: string }
        category: { type: string }
        basePrice: { type: number }
        active: { type: boolean }
    Variant:
      type: object
      properties:
        _id: { type: string }
        style: { type: string, description: "Style _id this variant belongs to" }
        size: { type: string }
        color: { type: string }
        sku: { type: string }
        barcode: { type: string }
        stock: { type: integer }
        priceOverride: { type: number, nullable: true }
        active: { type: boolean }
    PaginatedResponse:
      type: object
      properties:
        page: { type: integer }
        limit: { type: integer }
        total: { type: integer }
        pages: { type: integer }
paths:
  /sales:
    get:
      summary: List sales (for accounting export)
      parameters:
        - { name: page, in: query, schema: { type: integer, default: 1 } }
        - { name: limit, in: query, schema: { type: integer, default: 25, maximum: 100 } }
      responses:
        "200":
          description: A page of sales
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/PaginatedResponse"
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: "#/components/schemas/Sale" }
        "401": { description: Missing or invalid API key }
  /styles:
    get:
      summary: List styles (for storefront catalog sync)
      parameters:
        - { name: page, in: query, schema: { type: integer, default: 1 } }
        - { name: limit, in: query, schema: { type: integer, default: 25, maximum: 100 } }
      responses:
        "200":
          description: A page of styles
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/PaginatedResponse"
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: "#/components/schemas/Style" }
        "401": { description: Missing or invalid API key }
  /variants:
    get:
      summary: List variants (for storefront stock-level sync)
      parameters:
        - { name: page, in: query, schema: { type: integer, default: 1 } }
        - { name: limit, in: query, schema: { type: integer, default: 25, maximum: 100 } }
      responses:
        "200":
          description: A page of variants
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/PaginatedResponse"
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: "#/components/schemas/Variant" }
        "401": { description: Missing or invalid API key }
webhooks:
  saleCompleted:
    post:
      summary: sale.completed — fired after a sale is finalized at checkout
      description: >
        NOT fired for a sale created by completing a layaway (a known v1
        gap — see the "Webhooks / public API" section of the project's
        roadmap for why). Delivered as an HTTP POST to the URL configured
        in Admin → Webhooks, signed with an X-Webhook-Signature header
        (sha256=<hmac-of-body-using-your-subscription-secret>).
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                event: { type: string, enum: [sale.completed] }
                timestamp: { type: string, format: date-time }
                data:
                  type: object
                  properties:
                    saleId: { type: string }
                    totalAmount: { type: number }
                    paymentMethod: { type: string }
                    itemCount: { type: integer }
                    createdAt: { type: string, format: date-time }
      responses:
        "200": { description: Acknowledged (any 2xx is treated as success; anything else is logged as a failed delivery, not retried in v1) }
  stockChanged:
    post:
      summary: stock.changed — fired after any stock-changing operation commits (sale, return, layaway, purchase-order receipt, manual restock)
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                event: { type: string, enum: [stock.changed] }
                timestamp: { type: string, format: date-time }
                data:
                  type: object
                  properties:
                    changes:
                      type: array
                      items:
                        type: object
                        properties:
                          variantId: { type: string }
                          styleId: { type: string }
                          stock: { type: integer }
      responses:
        "200": { description: Acknowledged (any 2xx is treated as success; anything else is logged as a failed delivery, not retried in v1) }
